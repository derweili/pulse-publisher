name: Deploy Edge to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/edge/**'
      - '.github/workflows/deploy-edge.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -w apps/edge

      - name: Type check
        run: npm run check -w apps/edge

      # MOS_SECRET_KEY is a Cloudflare Worker runtime secret, not a build-time
      # env var — set once per environment with `wrangler secret put`, not on
      # every deploy. Same pattern as EMDASH_API_TOKEN in deploy-site.yml.
      #
      # No separate build step: `wrangler deploy` bundles the Worker's TS
      # directly, unlike apps/site which needs `astro build` first.
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/edge
